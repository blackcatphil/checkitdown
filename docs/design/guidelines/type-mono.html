<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--cid-ink-800);font-family:var(--cid-font-ui);color:var(--cid-text)}
.s{margin-bottom:13px}
.l{font:500 9px/1 var(--cid-font-mono);letter-spacing:.16em;color:var(--cid-dim);margin-bottom:6px}
.num{font-variant-numeric:tabular-nums;color:var(--cid-text)}
</style></head><body>
<div class="s"><div class="l">RANK · 600 15</div><div class="num" style="font:var(--cid-rank);color:var(--cid-value)">#1</div></div>
<div class="s"><div class="l">NUM-LG · 500 17</div><div class="num" style="font:var(--cid-num-lg)">$1,100 &middot; 22.2%</div></div>
<div class="s"><div class="l">NUM · 500 13</div><div class="num" style="font:var(--cid-num)">10% to $3 &middot; $1 drop &middot; 35 tables</div></div>
<div class="s"><div class="l">TAG · 500 11 / .16em</div><div style="font:var(--cid-tag);letter-spacing:var(--cid-track-nav);color:var(--cid-dim)">JUST THE FACTS</div></div>
<div class="s"><div class="l">LABEL · 600 9.5 / .18em</div><div style="font:var(--cid-label);letter-spacing:var(--cid-track-label);color:var(--cid-dim)">HOW WE READ THE BUY-IN</div></div>
</body></html>
