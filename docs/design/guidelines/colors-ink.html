<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--cid-ink-800);font-family:var(--cid-font-ui);color:var(--cid-text)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}
.chip{height:64px;border-radius:3px;border:1px solid var(--cid-line-2)}
.n{margin-top:7px;font:500 9px/1.4 var(--cid-font-mono);letter-spacing:.08em;color:var(--cid-dim)}
.v{font:400 8.5px/1.4 var(--cid-font-mono);color:var(--cid-dim)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--cid-ink-900)"></div><div class="n">ink-900</div><div class="v">#08090B</div></div>
<div class="sw"><div class="chip" style="background:var(--cid-ink-800)"></div><div class="n">ink-800 · page</div><div class="v">#0C0E11</div></div>
<div class="sw"><div class="chip" style="background:var(--cid-ink-700)"></div><div class="n">ink-700 · raised</div><div class="v">#14171B</div></div>
<div class="sw"><div class="chip" style="background:var(--cid-ink-600)"></div><div class="n">ink-600 · popup</div><div class="v">#1B1F26</div></div>
<div class="sw"><div class="chip" style="background:var(--cid-paper)"></div><div class="n">paper · text</div><div class="v">#F2F4F6</div></div>
<div class="sw"><div class="chip" style="background:var(--cid-dim)"></div><div class="n">dim · the floor</div><div class="v">58% ≈ 5.3:1</div></div>
</div></body></html>
