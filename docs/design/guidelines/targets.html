<!-- @dsCard group="Layout" viewport="700x180" name="Targets" subtitle="44px minimum on desktop too — mobile is coming" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--cid-ink-800);font-family:var(--cid-font-ui);color:var(--cid-text)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.note{margin-top:16px;font:400 11px/1.5 var(--cid-font-ui);color:var(--cid-text-3);max-width:640px}
</style></head><body>
<div class="row">
<span style="min-height:44px;display:inline-flex;align-items:center;padding:15px 22px;border-radius:3px;background:var(--cid-accent-700);border-top:1px solid var(--cid-accent-300);font:600 11.5px/1 var(--cid-font-mono);letter-spacing:.15em;color:var(--cid-paper)">ADD TO COMPARE</span>
<span style="min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:3px;border:1px solid var(--cid-line-3);font:600 11px/1 var(--cid-font-mono);letter-spacing:.14em;color:var(--cid-text-2)">&#10003; IN COMPARE</span>
<span style="min-height:44px;display:inline-flex;align-items:center;cursor:pointer"><span style="display:inline-flex;align-items:center;padding-bottom:3px;font:500 12px/1 var(--cid-font-ui);color:var(--cid-text-3);border-bottom:1px solid rgba(242,244,246,.24)">Report a correction</span></span>
<span style="min-width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;background:var(--cid-accent-500);font:600 13px/1 var(--cid-font-mono);color:var(--cid-paper)">9</span>
</div>
<div class="note">Mobile is deferred, not cancelled. Nothing may depend on hover alone: the map's glance popup carries an explicit OPEN FULL DETAILS button rather than making the popup itself the link.</div>
</body></html>
