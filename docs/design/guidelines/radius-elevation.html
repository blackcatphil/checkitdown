<!-- @dsCard group="Layout" viewport="700x180" name="Radius & elevation" subtitle="Nearly square — pills are for pins only" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--cid-ink-800);font-family:var(--cid-font-ui);color:var(--cid-text)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.b{width:120px;height:64px;background:var(--cid-ink-700);border:1px solid var(--cid-line-2);display:flex;align-items:center;justify-content:center;font:400 9px/1 var(--cid-font-mono);color:var(--cid-dim)}
</style></head><body>
<div class="row">
<div class="b" style="border-radius:3px">3 &middot; actions</div>
<div class="b" style="border-radius:4px">4 &middot; chips</div>
<div class="b" style="border-radius:999px">999 &middot; pins</div>
<div class="b" style="border-radius:3px;background:var(--cid-ink-600);box-shadow:var(--cid-shadow-pop)">popup</div>
<div class="b" style="border-radius:3px;background:var(--cid-ink-600);box-shadow:var(--cid-shadow-toast)">toast</div>
</div></body></html>
