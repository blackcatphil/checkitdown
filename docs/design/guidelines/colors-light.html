<!-- @dsCard group="Colors" viewport="700x180" name="Light mode" subtitle="Secondary mode — accent type darkens on paper" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#F2F4F6;font-family:var(--cid-font-ui)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}
.chip{height:64px;border-radius:3px;border:1px solid rgba(16,19,26,.16)}
.n{margin-top:7px;font:500 9px/1.4 var(--cid-font-mono);letter-spacing:.08em;color:rgba(16,19,26,.62)}
.v{font:400 8.5px/1.4 var(--cid-font-mono);color:rgba(16,19,26,.62)}
</style></head><body data-cid-theme="light"><div class="row">
<div class="sw"><div class="chip" style="background:#F2F4F6"></div><div class="n">page</div><div class="v">#F2F4F6</div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="n">raised</div><div class="v">#FFFFFF</div></div>
<div class="sw"><div class="chip" style="background:#10131A"></div><div class="n">text</div><div class="v">#10131A</div></div>
<div class="sw"><div class="chip" style="background:#5E3A93"></div><div class="n">accent type</div><div class="v">#5E3A93</div></div>
<div class="sw"><div class="chip" style="background:#0F7A6C"></div><div class="n">value</div><div class="v">#0F7A6C</div></div>
</div></body></html>
