<!-- @dsCard group="Components" viewport="700x210" name="Actions" subtitle="One filled action per screen; everything else is quiet" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;background:var(--cid-ink-800);font-family:var(--cid-font-ui);color:var(--cid-text)}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.note{font:400 11px/1.5 var(--cid-font-ui);color:var(--cid-text-3);max-width:640px}
</style></head><body>
<div class="row">
<span style="min-height:44px;display:inline-flex;align-items:center;padding:15px 22px;border-radius:3px;background:var(--cid-accent-700);border-top:1px solid var(--cid-accent-300);font:600 11.5px/1 var(--cid-font-mono);letter-spacing:.15em;color:var(--cid-paper)">ADD TO CALENDAR</span>
<span style="min-height:44px;display:inline-flex;align-items:center;padding:15px 22px;border-radius:3px;background:rgba(94,58,147,.35);border-top:1px solid var(--cid-accent-300);font:600 11.5px/1 var(--cid-font-mono);letter-spacing:.15em;color:rgba(242,244,246,.5)">ADDED</span>
<span style="min-height:44px;display:inline-flex;align-items:center;cursor:pointer"><span style="display:inline-flex;align-items:center;padding-bottom:3px;font:500 12px/1 var(--cid-font-ui);color:var(--cid-text-3);border-bottom:1px solid rgba(242,244,246,.24)">Report a correction</span></span>
<span style="min-height:44px;display:inline-flex;align-items:center;cursor:pointer"><span style="display:inline-flex;align-items:center;gap:6px;padding-bottom:3px;font:500 12px/1 var(--cid-font-ui);color:var(--cid-text-3);border-bottom:1px solid rgba(242,244,246,.24)">Room's published structure <span style="font:500 11px/1 var(--cid-font-mono)">&#8599;</span></span></span>
</div>
<div class="note">The 1px <strong>#A98CE8</strong> lit top edge is the brand's tell and is not optional. If a second filled action appears on a screen, one of them is wrong — demote it. External links always carry the arrow: our own links stay bare.</div>
</body></html>
