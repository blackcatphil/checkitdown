name: CI

on:
  push:
  pull_request:

# One run per ref; a superseded push should not keep burning a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # EVERY STEP'S ABSENCE MUST BE LOUD.
    #
    # The trap this guards against: a workflow that silently skips a step still
    # reports success. If `supabase start` fails and the suite is conditional,
    # the job goes green having run nothing — and that failure is invisible for
    # months, because green is exactly what you expect to see.
    #
    # So: no `continue-on-error`, no `if:` guards on any test step, and each
    # precondition is ASSERTED before the suite that depends on it rather than
    # assumed. A missing database fails at the assertion, not silently inside a
    # suite that then reports 0 passed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --- GATE 1: pure logic. Cheapest, so it runs first and fails fastest. ---
      #
      # Each gate RUNS ONCE, ECHOES, then asserts. The first version ran each
      # suite twice — once for the exit code, once to grep — which doubles the
      # work and lets the two runs disagree. It also captured output into a
      # variable and never printed it, so when the assertion failed the log
      # showed the complaint and not the evidence. Both fixed here.
      - name: "test:unit (pure logic — the floor is asserted below, not named here)"
        run: |
          set -euo pipefail
          npm run --silent test:unit 2>&1 | tee /tmp/unit.log
          grep -qE '^. fail 0' /tmp/unit.log \
            || { echo "::error::test:unit reported failures"; exit 1; }
          n=$(grep -oE '^. tests [0-9]+' /tmp/unit.log | grep -oE '[0-9]+')
          echo "unit assertions: $n"
          # 119, audited 2026-08-09. Was 6 — a tripwire from when this suite WAS
          # six tests, left untouched while it grew to 119. A floor 113 below
          # reality does not catch a shrinking suite; it catches a deleted one,
          # 126 on 2026-08-09: +7 for lib/filter-groups, the collapse resolver.
          # 137 on 2026-08-09: +11 for lib/description, the prose interpolation.
          # 149 on 2026-08-09: +12 for lib/differ — the CSV parse, the diff and
          # the rake batching that makes a gained rake expressible at all.
          # 159 on 2026-08-09: +10 for lib/floor-sheet — the real sheet shape, the
          # rake notation, and the room-name resolution that refuses to guess.
          # 163 on 2026-08-09: +4 for first-seen dating and the partner-prose scope.
          # 169 on 2026-08-10: +6 for lib/tournaments — how a schedule reads.
          # 172 on 2026-08-10: +3 for the room-timezone parse — an evening event
          # belongs to the day it runs, not the UTC day.
          # 195 on 2026-08-11: +17 for lib/qr — the encoder written rather than
          # depended on, and its tables checked three ways: data + EC = the
          # version total, the version total = the free modules the geometry
          # leaves, and a round trip through an independent decoder. A wrong
          # NUMBER in those tables makes a symbol that renders perfectly and
          # does not scan, which nothing else in this repo could see.
          # +6 for lib/install — platform detection against real user-agent
          # strings, including the iPad that reads as a laptop.
          # 206 on 2026-08-11: +11 for lib/wynn-dailies — the four Wynn dailies
          # are transcribed by hand in BOTH supabase/seed.sql and
          # scripts/tournaments/wynn.py, and were verified equal exactly once,
          # by a person. Chat ruled both copies stay: the seed cannot fetch
          # live PDFs (db reset must work with no network) and the ingest is
          # the only path that reaches production. So the pair is diffed on all
          # 18 stored columns instead, off disk, in the cheapest gate there is.
          # 222 on 2026-08-11: +13 for lib/tournament-terms — the rebuy and
          # add-on parse, which reads a room's own sentence back out and is the
          # cross-check that stops `reentry_note` and the new columns drifting
          # into contradicting each other on the same card. +3 in
          # lib/wynn-dailies for the ten new columns: the pair gate now diffs 28
          # columns per daily instead of 18, and parses the note on both copies.
          # 236 on 2026-08-11: +14 for lib/tournament-filters — /tournaments
          # goes from 65 rows to several hundred with three rooms in, and a
          # filtered table does not LOOK filtered, it looks like a shorter
          # schedule. The assertions that matter are the two that keep a filter
          # honest: an unknown value is DROPPED so a stale bookmark shows
          # everything rather than nothing, and a row that cannot answer a
          # dimension is KEPT so a gap in our data is never published as a fact
          # about a room's schedule.
          # which is not the failure worth guarding.
          [ "${n:-0}" -ge 236 ] \
            || { echo "::error::test:unit ran $n tests (expected >= 236) — a suite that shrinks still exits 0"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase start
        run: supabase start

      # Assert the stack is genuinely up. `supabase start` exiting 0 is not the
      # same as Postgres accepting connections.
      - name: Assert database is reachable and seeded
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          rooms=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -qtAX -c 'select count(*) from rooms')
          games=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -qtAX -c 'select count(*) from cash_games')
          echo "rooms=$rooms games=$games"
          [ "$rooms" = "17" ] || { echo "::error::expected 17 seeded rooms, got '$rooms' — migration or seed did not run"; exit 1; }
          [ "$games" = "78" ] || { echo "::error::expected 78 seeded cash games, got '$games'"; exit 1; }

      # --- GATE 2: RLS + grants, against the real roles. ---
      - name: "test:rls (RLS + grants — the floor is asserted below)"
        run: |
          set -euo pipefail
          supabase test db 2>&1 | tee /tmp/rls.log
          grep -q 'All tests successful' /tmp/rls.log \
            || { echo "::error::pgTAP did not report success"; exit 1; }
          n=$(grep -oE 'Tests=[0-9]+' /tmp/rls.log | head -1 | cut -d= -f2)
          echo "pgTAP assertions: $n"
          # 51, audited 2026-08-09. Was 10, set when the RLS file held ten
          # assertions; it has since absorbed the intake-Phase-I coverage —
          # room_amenities, the floor-stamp path both ways, insert proposals —
          # 57 on 2026-08-09: +6 for room_descriptions — read access, the
          # queue-only write path, and the no-typed-currency constraint.
          # 79 on 2026-08-09: +22 for THE PRECEDENCE LAW — every cell of the
          # matrix separately, the grouped-rake transaction and its all-or-nothing
          # rollback, and the service-caller boundary.
          # 80 on 2026-08-09: +1, and every rake fixture pinned by identity — three
          # of them drew a random row per reset and failed about one run in three.
          # 86 on 2026-08-10: +6 pinning jackpot_drop as a rake field — the receipt
          # went to the wrong column and reached production before anything caught it.
          # 95 on 2026-08-10: +9 for the tournament tables, which had held ZERO rows
          # since they were created. Every constraint on them was a hypothesis; one
          # of them turned out to enforce nothing.
          # 107 on 2026-08-10: +12 for the series — 659 transcribed levels, the
          # mixed-game primary key, and the six Day 2 rows that take no entry.
          # and 41 of those could have vanished under the old number.
          # 141 on 2026-08-11: +16 for migration 015 — an unpublished split.
          # Both generated columns were DROPPED and RE-ADDED to change their
          # expressions, so the first two assertions are that the rebuild
          # RECOMPUTED rather than blanked the rows that already existed. The
          # one that matters most is `fee_percent is NULL, not 0.00`: zero would
          # sort The Orleans to the top of a fee ranking claiming the house
          # takes nothing, about a room that has published no claim at all.
          # Plus the Bellagio shape — a $133 mandatory entry, a voluntary $17
          # at-registration gratuity, and the room's "$150" quoted beside it.
          # 145 on 2026-08-11: +4 for migration 016 — a level length the integer
          # cannot hold. The one that earns its place is "a numeric AND a note
          # is refused": the surface renders the numeric when there is one, so a
          # row holding both would carry a claim no reader can see, and an
          # invisible claim is one nobody can catch being wrong.
          # 125 on 2026-08-11: +18 for the rebuy and add-on constraints
          # (migration 014). Half are refusals — a threshold with no price,
          # "unlimited" with nothing to buy, two answers to "how many" — and
          # half are the positives that stop those refusals being a wall: the
          # Wynn shape, the Caesars shape, no-re-entry-with-rebuys, and a bare
          # price with nothing else. Plus the backfill itself, asserted BEFORE
          # the constraints so a migration that applied against zero matching
          # rows cannot pass this section on an empty table.
          [ "${n:-0}" -ge 145 ] \
            || { echo "::error::pgTAP ran $n tests (expected >= 145) — a shrinking suite is a silent regression"; exit 1; }

      # --- GATE 2b: THE PROSE WRITE PATH, which writes to prod every morning. ---
      #
      # `scripts/differ.mjs` runs against PRODUCTION at 05:00 Pacific, daily,
      # unattended, with DIFFER_APPLY=1. Its prose branch — insert, decline to
      # rewrite unchanged text, replace changed text — was verified by hand
      # once and had NEVER run in CI. The daily job was the only thing
      # exercising it, on the one database where being wrong is expensive.
      #
      # This drives the REAL differ as a subprocess, exactly as the cron job
      # does, feeding it a fixture through a `data:` URL — so no network, no
      # test hatch in the write path, and readSource / readReviews /
      # firstSeenDate / stageDescription / approve_change_group all run for
      # real. It needs psql (installed above) and no web server.
      - name: "test:prose (insert, idempotence, rewrite — the daily write path)"
        env:
          PSQL: psql
        run: |
          set -euo pipefail
          npm run --silent test:prose 2>&1 | tee /tmp/prose.log
          grep -q '0 failed' /tmp/prose.log \
            || { echo "::error::the prose write path did not behave — see the assertions above"; exit 1; }
          # THE IDEMPOTENCE ASSERTIONS ARE THE REASON THIS GATE EXISTS. A broken
          # insert is loud: the summary says FAULT and the run goes red. A
          # broken idempotence check is silent and cumulative — a change_log
          # entry every morning for prose nobody touched, written_at marching
          # forward, and within a week every review on the site reads "written
          # today" while still looking perfectly healthy.
          grep -q 'PASS  written_at DID NOT MOVE' /tmp/prose.log \
            || { echo "::error::the first-seen assertion did not run — a re-stamping differ makes every date on the site worthless within a week"; exit 1; }
          grep -q 'PASS  and writes NO change_log entry' /tmp/prose.log \
            || { echo "::error::the no-op assertion did not run"; exit 1; }
          grep -q 'PASS  still exactly ONE description for the room' /tmp/prose.log \
            || { echo "::error::the replace-not-duplicate assertion did not run"; exit 1; }
          # A probe that leaves prose on a room page has changed the product,
          # and the only thing that would notice is a census in another suite.
          grep -q 'PASS  the database is restored' /tmp/prose.log \
            || { echo "::error::the restore assertion did not run — this suite writes to the database"; exit 1; }
          n=$(grep -c '^  PASS' /tmp/prose.log || true)
          echo "prose assertions: $n"
          # 23 on 2026-08-11, the first run of this gate. Verified to fail:
          # neutering the byte-identical compare in firstSeenDate turns four of
          # these red, including written_at being dragged to today.
          [ "$n" -ge 23 ] \
            || { echo "::error::only $n prose assertions ran (expected >= 23) — the suite shrank"; exit 1; }

      # The anon key is generated per-stack, so it is read from the running
      # stack rather than hardcoded — a stale key would fail at request time,
      # inside a suite, looking like a product bug.
      - name: Capture stack env
        run: |
          set -euo pipefail
          key=$(supabase status -o json | jq -r '.ANON_KEY')
          [ -n "$key" ] && [ "$key" != "null" ] \
            || { echo "::error::could not read ANON_KEY from the running stack"; exit 1; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key"
          } >> "$GITHUB_ENV"

      # The map's worker is a GENERATED copy of a file from node_modules. If it
      # drifts from the installed maplibre-gl, the worker dies on load and the
      # map requests NO TILES — silently, with a clean console and a 200 style.
      # That failure survived weeks of investigation, so it gets a gate.
      - name: "check:worker (the map's worker matches the installed package)"
        run: npm run check:worker

      - name: next build
        run: npm run build

      # test:mixed reads RENDERED OUTPUT after mutating the database, so it
      # requires a server that re-renders per request. /rooms/[slug] is
      # prerendered with revalidate=300, so `next start` serves a build-time
      # snapshot and the mutations are invisible for five minutes — every
      # room-page assertion failed here while every /facts one passed.
      #
      # The suite was correct locally only because `npm run dev` re-renders
      # every request: true by accident of environment, not by construction.
      # `next build` above still gates the production build; the suite runs
      # against dev, which is the mode its premise actually holds in.
      - name: next dev
        run: |
          set -euo pipefail
          npm run dev &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:3000/facts && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/facts \
            || { echo "::error::the app never became reachable — test:mixed reads rendered output and would otherwise pass vacuously"; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:3000/rooms/horseshoe \
            || { echo "::error::room pages unreachable — the suite's room-page scenarios would fail for the wrong reason"; exit 1; }

      # THE CENSUS IS TAKEN, NOT ASSUMED. The old rollback check counted
      # `rooms.verified_at` and nothing else — a room-level proxy for
      # verification that is per-FACT, which is the same mistake the provenance
      # block was carrying. The suite now moves cash_games.verified_at,
      # rake_verified_at, room_amenities.verified_at and room_formats.verified_at
      # to force its scenarios; none of those were visible to the gate, so a
      # broken rollback could leave verification stamps behind and still report
      # a clean database. Snapshot before, diff after: no hardcoded baseline to
      # go stale the next time a floor visit lands.
      - name: Census before test:mixed
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -qtAX -f scripts/census.sql > /tmp/census-before.txt
          cat /tmp/census-before.txt

      - name: "test:mixed (the assertion floor is asserted below, not named here)"
        env:
          PSQL: psql
          BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run --silent test:mixed 2>&1 | tee /tmp/mixed.log
          grep -q 'All mixed-state checks passed' /tmp/mixed.log \
            || { echo "::error::mixed-state suite did not pass"; exit 1; }
          n=$(grep -c '^   PASS' /tmp/mixed.log || true)
          echo "assertions passed: $n"
          # 136, audited 2026-08-09 (was 128 — the smallest drift in the repo,
          # 145 on 2026-08-09: +9 for the description scenario, which asserts the
          # no-typed-figures rule against RENDERED output and carries its own
          # planted-stray negative control.
          # 144 on 2026-08-09: the no-rake-room assertions now DERIVE the room from the
          # ranking rule and skip when the case has no instance, so the count moved.
          # 146 on 2026-08-10: +2 for partner prose — paragraphs rendered, and the
          # text compared to what the database holds, character for character.
          # 146 on 2026-08-10: the tilde expectation now describes a room page that
          # lists dailies and summarises the series.
          # and the only floor that had been kept roughly current).
          [ "$n" -ge 146 ] || { echo "::error::only $n assertions ran (expected >= 146) — the suite shrank, which is a silent regression"; exit 1; }

      - name: Assert the database was left clean
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -qtAX -f scripts/census.sql > /tmp/census-after.txt
          diff /tmp/census-before.txt /tmp/census-after.txt \
            || { echo "::error::test:mixed did not restore the database — the diff above is what it left behind, and its rollback is broken"; exit 1; }

      # --- GATE 3b: THE ADMIN GATE, with a real session. ---
      #
      # Every privilege assertion in test:rls is made with `set local role` plus
      # a hand-built claims blob. That proves the SQL and proves nothing about
      # whether a person can sign in and be recognised — and the PKCE bug lived
      # in exactly that gap: Supabase logged action=login while the app said
      # "code verifier not found in storage", with every gate green.
      #
      # This mints a magic link through the Admin API, drives the app's own
      # /auth/callback with it, and asks the database who it is over HTTP with
      # the cookies that came back. It needs no dashboard change to run:
      # generate_link returns the same token hash the email template carries.
      - name: "test:auth (sign-in, is_admin, and who may approve)"
        env:
          PSQL: psql
          BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run --silent test:auth 2>&1 | tee /tmp/auth.log
          grep -q '0 failed' /tmp/auth.log \
            || { echo "::error::the admin gate did not behave — see the assertions above"; exit 1; }
          # THE POSITIVE CONTROL IS THE POINT. Refusals alone are satisfied by a
          # function that refuses everyone, which is a wall rather than a gate.
          grep -q 'PASS  ...and ACCEPTED for the admin' /tmp/auth.log \
            || { echo "::error::the admin-accepted control did not run — the refusals prove nothing without it"; exit 1; }
          n=$(grep -c '^  PASS' /tmp/auth.log || true)
          echo "auth assertions: $n"
          # THE OPEN-REDIRECT SPELLINGS, PINNED BY NAME. They are not variations
          # on one bug — protocol-relative, backslash-folding and whitespace-
          # stripping are three different parser behaviours that happen to meet
          # in this one guard, and `/\evil.example` was a LIVE open redirect on
          # a sign-in link until 2026-08-09. A single "rejects a bad next"
          # assertion would let the other two back silently.
          # -F, NOT -q alone: the backslash spelling is a REGEX to plain grep, so
          # '"/\\evil.example"' quietly matched nothing and the guard-assertion
          # guard was itself vacuous. Verified against a real log, not reasoned about.
          for spelling in '"//evil.example"' '"/\\evil.example"'; do
            grep -qF "next=$spelling cannot leave our origin" /tmp/auth.log \
              || { echo "::error::the $spelling redirect assertion did not run"; exit 1; }
          done
          # 14 on 2026-08-09, the first run of this gate.
          # 20 on 2026-08-09: +6 for the open-redirect spellings and the
          # 21 on 2026-08-09: +1, a guard that a web-ranked room exists to test
          # authorisation against — the seed sync re-sourced the row it used to draw.
          # legitimate-next control that stops "refuse everything" passing.
          [ "$n" -ge 21 ] \
            || { echo "::error::only $n auth assertions ran (expected >= 21) — the suite shrank"; exit 1; }

      - name: lint
        run: npm run lint

      # --- GATE 4: the map, OBSERVED IN A BROWSER. ---
      #
      # Everything above this line passed for months while the map drew nothing.
      # No unit test, no rendered-HTML assertion and no type check can see a
      # dead Web Worker: the markup is identical, the canvas element is present
      # and correctly sized, and the console is empty. The only signal that
      # separates a working map from a dead one is whether it ASKED FOR TILES.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: "test:map (tile requests + painted pixels, observed)"
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm run --silent test:map 2>&1 | tee /tmp/map.log
          grep -q 'Map probe passed' /tmp/map.log \
            || { echo "::error::the map probe did not pass"; exit 1; }
          grep -q 'PASS  THE MAP REQUESTED TILES' /tmp/map.log \
            || { echo "::error::the tile-request assertion did not run — it is the whole point of this gate"; exit 1; }
          # ⚠️ THE TILE-FAILURE LINE MUST STILL BE MEASURED, just not asserted.
          # It was split on 2026-08-11: "did the map ask" is ours and stays red;
          # "did some remote fetches drop" is the network's and is REPORTED.
          # The floor below drops by one because of that, so this guard is what
          # stops the split from becoming a deletion — a NOTE line has to be
          # there, saying what was counted.
          grep -q '^  NOTE .*tile fetch' /tmp/map.log \
            || { echo "::error::the tile-failure count is not being reported at all — the split became a deletion"; exit 1; }
          n=$(grep -c '  PASS' /tmp/map.log || true)
          echo "map assertions: $n"
          # 18 IN THIS CONFIGURATION, 35 WITH THE DEBUG HANDLE.
          #
          # CI deliberately probes the SHIPPING build, so `window.__cid_map`
          # does not exist and every rendered-feature assertion degrades to a
          # named SKIP. Raised from 8 on 2026-08-09: the floor had drifted far
          # below what actually runs — the probe had grown to 13 here long
          # before the stakes filters added five more, and a floor of 8 would
          # have let ten assertions disappear without a word. That is the exact
          # failure the floor exists to catch, sitting inside the floor itself.
          #
          # The two SKIPped assertions are the ARIA counter-example and the
          # Bellagio control. They are not lost coverage: both run
          # unconditionally in lib/stakes-filter.test.mjs under test:unit.
          # Raise this number when assertions are added; never lower it to make
          # 24 on 2026-08-09: +2 for the measured collapse default and the 44px
          # targets, +4 for the invisible-filter trap (rules 1 and 2, by name).
          # 28 on 2026-08-10: +4 for the attribution contract — present in compact
          # form, genuinely collapsed, and the full credit one tap away. It is a
          # LICENCE condition, so "compact" must not be able to drift into "hidden".
          # a run pass.
          # 27 on 2026-08-11 — A DELIBERATE DECREASE, and the only one in this
          # file. `no tile request failed` stopped being an assertion and became
          # a NOTE: a dropped tile on a runner's network is not a fact about
          # this codebase, and it was the one line here that went red for
          # somebody else's reason. What is NOT weakened is the line above it —
          # zero tiles requested is the dead-worker regression this whole gate
          # was written for and stays hard. No retry was added either: a retry
          # would make "asked and the network dropped it" indistinguishable from
          # "stopped asking", which is the distinction the gate exists for.
          # The NOTE guard above is what keeps this decrease honest.
          [ "$n" -ge 27 ] \
            || { echo "::error::only $n map assertions ran (expected >= 27)"; exit 1; }
          # The SKIPs must stay SKIPs. If these stop appearing without the floor
          # moving, the shipping build has grown a debug handle.
          s=$(grep -c '^  SKIP' /tmp/map.log || true)
          echo "map assertions skipped (need MAP_DEBUG): $s"

      # --- GATE 5: the phone, and the promise not to cache a fact. ---
      #
      # Placed AFTER the Chromium install on purpose: both probes drive
      # Playwright, and putting them above it fails on a missing browser rather
      # than on anything about the app.
      #
      # THE SERVICE WORKER REGISTERS UNDER `next dev` — measured 2026-08-07 on a
      # cold server whose only prior request was `/`: 23 of 23, nothing skipped.
      # So this gate needs no production server and no second port; it runs
      # against the same dev server as gates 3 and 4. That question was settled
      # by measurement rather than assumed, because the obvious guess — "service
      # workers are a production thing" — would have bought a `next start` step
      # and a second port for no reason.
      - name: "test:mobile (390px: the phone layout, and the map if the handle exists)"
        env:
          # DEFENCE IN DEPTH, and it documents the dependency at the step.
          # This probe stages a description fixture through scripts/psql-path.mjs,
          # which now resolves `psql` from PATH by itself — so this line is no
          # longer load-bearing. It is stated anyway, matching test:mixed, so a
          # reader of this step can see that it talks to the database at all.
          PSQL: psql
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm run --silent test:mobile 2>&1 | tee /tmp/mobile.log
          grep -q '0 failed' /tmp/mobile.log \
            || { echo "::error::the mobile probe reported failures"; exit 1; }
          # THE 494px HEADER IS WHY THIS GATE EXISTS. Every page overflowed a
          # 390px viewport by the same amount, because the cause was one shared
          # header rather than four page bugs.
          grep -q 'PASS  facts: no horizontal overflow' /tmp/mobile.log \
            || { echo "::error::the overflow assertions did not run — they are the point of this gate"; exit 1; }
          grep -q 'PASS  facts: the rank qualifier survives on the card' /tmp/mobile.log \
            || { echo "::error::the rank-qualifier assertion did not run — a bare '#3' with no sort is a number attached to nothing"; exit 1; }
          # ONE NAV, NOT TWO. This shipped broken from the day the bottom bar
          # landed and no assertion could see it, so its absence is a hard
          # failure rather than a quiet drop in the count.
          grep -q 'PASS  facts: the HEADER nav is gone' /tmp/mobile.log \
            || { echo "::error::the one-nav assertion did not run — the header nav shipped alongside the bottom bar for two days without it"; exit 1; }
          n=$(grep -c '^  PASS' /tmp/mobile.log || true)
          echo "mobile assertions: $n"
          # 43 IN THIS CONFIGURATION, 52 WITH THE DEBUG HANDLE.
          #
          # Raised from 13 on 2026-08-09 by the floor audit. 13 was true when
          # the probe measured the map alone; it then grew the bottom nav, the
          # safe-area and clearance checks, the hydration/console gate and the
          # Safari-height corridor case, and the floor never moved — THIRTY
          # assertions could have disappeared without a word.
          #
          # The 4 SKIPs read `window.__cid_map`, which exists only under
          # NEXT_PUBLIC_MAP_DEBUG=1; CI probes the SHIPPING configuration, so
          # they skip with a named reason and everything else runs in full.
          # 46 on 2026-08-09: +3 for sheet reachability with the groups collapsed,
          # including the one-scroller assertion that replaced the 46vh nest.
          # 50 on 2026-08-09: +4 for the description section at 390px — reading
          # measure, overflow, and prose-vs-figures set in different faces.
          # 53 on 2026-08-10: the entry-camera height sweep (4 viewports) and the
          # scroll-defect assertions, less the two corridor-anchor claims the
          # skyline-first ruling retired.
          # 55 on 2026-08-10: the map page became a scrolling document — the panel
          # sits below the map, the document scrolls, and the panel is no longer its
          # own scroller. Plus the seasonal toggle asserted ABSENT, not deleted quietly.
          # 59 on 2026-08-10: +4 for the AT-REST assertions. Every panel check in this
          # file tapped the handle first, so the suite passed against a page that
          # shipped with the filters capped at the 92px peek.
          # 65 on 2026-08-10: +6 for the tournaments section at 390px, including
          # empty-safe on a room that has none.
          # 65 on 2026-08-10: the tournaments page at 390px.
          # 83 on 2026-08-11: +8 for /install joining the per-surface sweep,
          # +5 for the FOOTER clearing the nav on every page — the old clearance
          # was a spacer inside <main> and this sweep only ever looked at
          # `main *`, so a footer buried under the fixed bar would have been
          # invisible to every assertion in the file. +2 for the one-branch rule
          # and the drawn glyph, +3 for the QR at 390px on the forced desktop
          # branch, which is where a fractional module width would show up.
          # 89 on 2026-08-11: +6 for ONE NAV, NOT TWO. The bottom bar's entire
          # justification is that the header drops its links below this
          # breakpoint, and that had never been true: the header nav carried
          # `display: flex` as an inline style, which beats the media query's
          # `display: none`, so every phone page shipped eight destinations in
          # two bars. Every assertion in this file passed throughout — the
          # header scrolls sideways by design, so even the overflow gate was
          # content. Found by looking at a screenshot, not by a probe.
          # Raise this when assertions are added; never lower it to pass a run.
          [ "$n" -ge 89 ] \
            || { echo "::error::only $n mobile assertions ran (expected >= 89) — the suite shrank"; exit 1; }
          # A skip must stay a skip. If these ever stop being skipped without
          # the floor moving, something changed configuration silently.
          s=$(grep -c '^  SKIP' /tmp/mobile.log || true)
          echo "mobile assertions skipped (need MAP_DEBUG): $s"

      - name: "test:pwa (installable, and the worker refuses to cache a fact)"
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm run --silent test:pwa 2>&1 | tee /tmp/pwa.log
          grep -q '0 failed' /tmp/pwa.log \
            || { echo "::error::the PWA probe reported failures"; exit 1; }
          # THE OFFLINE ASSERTIONS ARE WHY THIS GATE EXISTS. A cached rake
          # figure served tomorrow is a stale fact presented as current, and it
          # is worse than a blank screen because it looks fine. If these two
          # ever stop RUNNING, the gate is green and the promise is unguarded.
          grep -q 'PASS  offline renders the honest offline state' /tmp/pwa.log \
            || { echo "::error::the offline-state assertion did not run — that promise is the reason this gate exists"; exit 1; }
          grep -q "PASS  and shows NO figures" /tmp/pwa.log \
            || { echo "::error::the no-stale-figures assertion did not run — same"; exit 1; }
          grep -q 'PASS  NO page HTML is in the cache' /tmp/pwa.log \
            || { echo "::error::the cache-contents assertion did not run — it is the strongest form of the promise"; exit 1; }
          # ⚠️ THE QR IS DECODED FROM RENDERED PIXELS, and that assertion is the
          # only thing in this repo that can see a wrong or unscannable QR. It
          # renders as a tidy square either way: right size, right contrast,
          # passes the palette gate, and fails only in a stranger's phone.
          grep -q 'PASS  the QR encodes the install URL' /tmp/pwa.log \
            || { echo "::error::the QR decode did not run — a wrong QR is invisible to every other check"; exit 1; }
          grep -q 'PASS  the QR keeps its four-module quiet zone' /tmp/pwa.log \
            || { echo "::error::the quiet-zone assertion did not run — it is the commonest reason a valid QR will not scan"; exit 1; }
          # A BUTTON THAT DOES NOTHING WHEN TAPPED is the failure the whole
          # Android design was shaped around. Both halves are pinned: it must
          # not appear without an offer, and dismissing must not re-arm it onto
          # a consumed event that would throw.
          grep -q 'PASS  no install button when the browser has not offered a prompt' /tmp/pwa.log \
            || { echo "::error::the dead-button assertion did not run"; exit 1; }
          grep -q 'PASS  dismissing REMOVES the button' /tmp/pwa.log \
            || { echo "::error::the re-arm assertion did not run — a second tap on a consumed event throws"; exit 1; }
          grep -q 'PASS  and the sign-in form is not offered inside the app' /tmp/pwa.log \
            || { echo "::error::the installed-app trap assertion did not run — that session can never arrive"; exit 1; }
          # ⚠️ THE TAB ICON IS OURS. app/favicon.ico was the NEXT.JS DEFAULT —
          # Vercel's black-disc-and-triangle — served as this site's identity in
          # every browser tab since launch, past every structural check here:
          # the file existed, the route returned 200, <link rel="icon"> pointed
          # at a real image, and all three manifest icons were correct and ours.
          # The assertion samples the PIXELS of the icon the document actually
          # declares. Verified to fail: restoring the default turns both lines
          # red at 0% brand blue.
          grep -q 'PASS  the tab icon is OUR mark' /tmp/pwa.log \
            || { echo "::error::the tab-icon assertion did not run — a framework logo passes every other check in this gate"; exit 1; }
          n=$(grep -c '^  PASS' /tmp/pwa.log || true)
          echo "pwa assertions: $n"
          # 53 IN CI, 54 ON macOS — and the one difference is deliberate.
          #
          # Chromium exposes BarcodeDetector on macOS and Android, backed by the
          # OS decoder, and NOT on Linux. So the "a REAL scanner agrees"
          # assertion is a second, independent opinion on the QR when the
          # platform has one and a named SKIP when it does not. The floor is set
          # to the Linux count so CI does not fail for lacking a decoder it was
          # never going to have; locally it runs and is worth having.
          #
          # 23 before 2026-08-11. Nothing else here is flag-gated: the worker
          # registers under `next dev`, so unlike the map gate this floor is not
          # otherwise reduced. If it drops, the worker stopped registering and
          # the probe will say so on its SKIP lines rather than passing vacuously.
          # +3 on 2026-08-11: the two tab-icon pixel assertions and
          # /favicon.ico being served at all.
          [ "$n" -ge 53 ] \
            || { echo "::error::only $n pwa assertions ran (expected >= 53) — check the SKIP lines above"; exit 1; }

      - name: "test:palette (every text node clears its floor, opacity composited)"
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm run --silent test:palette 2>&1 | tee /tmp/palette.log
          grep -q '0 failed' /tmp/palette.log \
            || { echo "::error::the palette probe reported failures"; exit 1; }
          # OPACITY COMPOSITING IS WHY THIS GATE EXISTS. Every prior audit
          # reported 0 failing text nodes over a compare-dim state that
          # measured 2.56:1, because opacity never appears in a computed
          # colour. If the composited floor check ever stops RUNNING, the
          # gate is green and the old blindness is back.
          grep -q 'opacity composited' /tmp/palette.log \
            || { echo "::error::the composited-opacity floor did not run — it is the point of this gate"; exit 1; }
          # A PROBE MUST PROVE THE PAGE RENDERED before certifying it clean:
          # this suite's own first version passed four screens that returned
          # 500 — zero text nodes, zero fills, zero gold, all 'clean'.
          grep -q 'the page rendered' /tmp/palette.log \
            || { echo "::error::the rendered-first guard did not run — an empty page passes every emptiness check"; exit 1; }
          grep -q 'gold never fills a surface' /tmp/palette.log \
            || { echo "::error::the gold-fill assertion did not run — the one discipline rule the palette law names"; exit 1; }
          # ⚠️ THE FILL DETECTOR MUST BE ABLE TO SEE A FILL. Until 2026-08-11 it
          # could not: the target colours are read from custom properties, which
          # return hex, and the parser understood rgb() only — so `sameFill()`
          # answered false for every element and BOTH fill assertions passed on
          # an empty list, on every screen, since the file was written. The
          # positive control is the only thing standing between that and a
          # repeat, so its absence is a hard failure rather than a lower count.
          grep -q 'PASS  install (Android, prompt offered): and the detector CAN see a fill' /tmp/palette.log \
            || { echo "::error::the fill-detector control did not run — 'no more than one filled action' is satisfied by a detector that finds nothing"; exit 1; }
          n=$(grep -c '^  PASS' /tmp/palette.log || true)
          echo "palette assertions: $n"
          # 31 on 2026-08-09: +6 for the room-detail screen, added so the new
          # prose text nodes are composited like every other. It surfaced two
          # em-dash markers at 3.29:1 on a page this probe had never opened.
          # 35 on 2026-08-10: +4 for THE FACTS grid — no orphan cell, every cell on
          # the tile background, and the confirmed-absent-vs-never-checked split.
          # The orphan bug presented AS a colour, so it is gated here.
          # 38 on 2026-08-10: +3 for the review formatting — paragraphs not a wall,
          # the reading measure inside 45-75, and the first-seen date still shown.
          # 51 on 2026-08-10: +13 for the Wynn room screen — the tournament text
          # nodes composited like every other.
          # 51 on 2026-08-10: the tournaments page text nodes, composited.
          # 72 on 2026-08-11: +20 for the four /install screens. Four, not one,
          # because the page renders ONE branch per reader and the other two are
          # unreachable from a desktop user agent — the iOS steps and the
          # Android menu copy would never have been composited at all. The
          # fourth stages a synthetic beforeinstallprompt so the install button
          # exists to be measured; it is the app's only resting filled action.
          # +1 for the fill-detector control that screen makes possible.
          # nothing here is flag-gated.
          [ "$n" -ge 72 ] \
            || { echo "::error::only $n palette assertions ran (expected >= 72) — the suite shrank"; exit 1; }

  # ═══════════════════════════════════════════════════════════════════════
  # THE DEBUG BUILD — the assertions the shipping build cannot make
  # ═══════════════════════════════════════════════════════════════════════
  #
  # `window.__cid_map` is exposed only under NEXT_PUBLIC_MAP_DEBUG=1 and never
  # ships. Everything that reads the live map through it — the rendered-mass
  # counts, the camera readings, the four-viewport skyline sweep, the
  # (variant, stakes) feature-state pair — therefore reported a named SKIP in
  # the job above and was verified nowhere but on Phil's Mac, by hand, when
  # somebody remembered.
  #
  # THAT IS NOT A SMALL GAP. Measured 2026-08-11: 18 map assertions and 13
  # mobile assertions run here and cannot run there. And the first time the two
  # flag-gated map assertions were actually EXECUTED — by this job — both were
  # RED, and had been since 2026-08-09. Not for a reason about the product: the
  # collapsed-filter trap that runs before them leaves two boxes checked and
  # unmounted, so the counter-example could not find its own checkbox and
  # returned `{ err: … }` into an assertion that read a different key off the
  # object and never looked at `err`. Six weeks of "verified on the Mac" was
  # verifying nothing. That is the entire argument for this job.
  #
  # ⚠️ THE FLAGLESS JOB STAYS AND IS THE AUTHORITY ON WHAT SHIPS. This one runs
  # a configuration no reader will ever load. It exists to check the map's
  # behaviour, not the build; if the two ever disagree about something other
  # than the handle, the flagless job is right.
  #
  # `next dev`, not `next build && next start`, for the same reason the job
  # above uses it: the mobile probe stages a description fixture through psql
  # and then reads a room page, and /rooms/[slug] is prerendered with
  # revalidate=300 — under `next start` the fixture is invisible for five
  # minutes and the prose assertions fail for a reason that is not about the
  # map.
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase start
        run: supabase start

      - name: Assert database is reachable and seeded
        # Same assertion as the main job, for the same reason: `supabase start`
        # exiting 0 is not the same as Postgres accepting connections, and every
        # map assertion below is about rooms that have to exist.
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          rooms=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -qtAX -c 'select count(*) from rooms')
          echo "rooms=$rooms"
          [ "$rooms" = "17" ] || { echo "::error::expected 17 seeded rooms, got '$rooms'"; exit 1; }

      - name: Capture stack env
        run: |
          set -euo pipefail
          key=$(supabase status -o json | jq -r '.ANON_KEY')
          [ -n "$key" ] && [ "$key" != "null" ] \
            || { echo "::error::could not read ANON_KEY from the running stack"; exit 1; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key"
          } >> "$GITHUB_ENV"

      # The map's worker is a GENERATED copy of a file in node_modules. `next
      # dev` does not run `prebuild`, so this job syncs it explicitly — a
      # drifted worker dies on load and the map requests NO TILES, silently,
      # which is the exact failure every assertion below would then blame on
      # something else.
      - name: "check:worker"
        run: npm run check:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: next dev, WITH the debug handle
        env:
          NEXT_PUBLIC_MAP_DEBUG: '1'
        run: |
          set -euo pipefail
          npm run dev &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:3000/facts && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/facts \
            || { echo "::error::the app never became reachable"; exit 1; }

      - name: "test:map WITH the handle (rendered masses, cameras, feature state)"
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm run --silent test:map 2>&1 | tee /tmp/map-debug.log
          grep -q 'Map probe passed' /tmp/map-debug.log \
            || { echo "::error::the map probe did not pass under the debug handle"; exit 1; }
          # ⚠️ ZERO SKIPS IS THE POINT OF THIS JOB. If the flag silently fails to
          # reach the browser — a typo in the env name, a Next change to how
          # NEXT_PUBLIC_* is inlined — every assertion this job exists for
          # degrades to a named SKIP and the suite still exits 0. The floor
          # would catch it eventually; this names the cause immediately.
          s=$(grep -c '^  SKIP' /tmp/map-debug.log || true)
          [ "$s" = "0" ] \
            || { echo "::error::$s map assertions SKIPPED in the debug job — the handle did not reach the page, so this job proved nothing"; exit 1; }
          # The two that had been red since 2026-08-09 while nobody was running
          # them, pinned by name so they cannot quietly go back to skipping.
          grep -q 'PASS  THE COUNTER-EXAMPLE: ARIA' /tmp/map-debug.log \
            || { echo "::error::the ARIA counter-example did not pass — this is the assertion this job was built to run"; exit 1; }
          grep -q 'PASS  THE CONTROL: Bellagio' /tmp/map-debug.log \
            || { echo "::error::the Bellagio control did not pass — a counter-example without a control proves nothing"; exit 1; }
          grep -q 'PASS  the filter panel is reset to a known state' /tmp/map-debug.log \
            || { echo "::error::the panel-reset assertion did not run — the two above pass or fail on leftover filter state without it"; exit 1; }
          grep -q 'PASS  the sourced buildings are RENDERED' /tmp/map-debug.log \
            || { echo "::error::the rendered-mass assertion did not run — it is the whole reason the handle exists"; exit 1; }
          n=$(grep -c '  PASS' /tmp/map-debug.log || true)
          echo "map assertions WITH the handle: $n"
          # 45, measured 2026-08-11 against 27 in the flagless job — so this job
          # recovers 18. Raise it when assertions are added; never lower it.
          [ "$n" -ge 45 ] \
            || { echo "::error::only $n map assertions ran with the handle (expected >= 45)"; exit 1; }

      - name: "test:mobile WITH the handle (the camera and the skyline sweep)"
        env:
          PSQL: psql
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          npm run --silent test:mobile 2>&1 | tee /tmp/mobile-debug.log
          grep -q '0 failed' /tmp/mobile-debug.log \
            || { echo "::error::the mobile probe reported failures under the debug handle"; exit 1; }
          s=$(grep -c '^  SKIP' /tmp/mobile-debug.log || true)
          [ "$s" = "0" ] \
            || { echo "::error::$s mobile assertions SKIPPED in the debug job — the handle did not reach the page"; exit 1; }
          # THE FOUR-VIEWPORT SWEEP is the assertion Phil's screenshot settled
          # by hand three times. Safari draws its URL bar over the page, so the
          # canvas is ~600px where the screen is 844 — the corridor fit is
          # measured against the viewport it actually gets, at four heights.
          grep -q 'PASS  the skyline draws at iPhone SE' /tmp/mobile-debug.log \
            || { echo "::error::the shortest-viewport skyline assertion did not run — it is the one that has inverted three times"; exit 1; }
          # Safari draws its URL bar OVER the page, so the canvas is ~400px
          # where the screen reports 844. Measuring the screen instead of the
          # viewport is how this assertion passed against a flat frame twice.
          grep -q "PASS  the skyline draws at Safari's real viewport" /tmp/mobile-debug.log \
            || { echo "::error::the Safari-viewport skyline assertion did not run"; exit 1; }
          grep -q 'PASS  all 17 rooms are accounted for at 390px' /tmp/mobile-debug.log \
            || { echo "::error::the room-reachability assertion did not run"; exit 1; }
          n=$(grep -c '^  PASS' /tmp/mobile-debug.log || true)
          echo "mobile assertions WITH the handle: $n"
          # 102, measured 2026-08-11 against 89 in the flagless job — 13
          # recovered. Raise it when assertions are added; never lower it.
          [ "$n" -ge 102 ] \
            || { echo "::error::only $n mobile assertions ran with the handle (expected >= 102)"; exit 1; }
