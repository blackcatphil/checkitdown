var ROOMS=[["ARIA",36.107029,-115.177998],["Bellagio",36.113115,-115.177007],
["Boulder Station",36.133783,-115.085261],["Caesars Palace",36.116628,-115.176757],

var KF=[["Trump International","205 m","levels-only, corridor tallest"],
["Horseshoe Las Vegas","83 m","levels-only"],["The LINQ","64 m","levels-only"],
["MGM Grand","tagged 2 storeys","podium tag on a 30-storey tower"],
["New York New York","tagged 2 storeys","podium tag"]];

var map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",
center:[-115.1709,36.1105],zoom:14.5,pitch:52,bearing:-18,canvasContextAttributes:{antialias:true}});

var idsSeen=0, idsMissing=0, roomHover=null;
function idFor(roomName){var f=FP.features.filter(function(x){return x.properties.room===roomName;})[0];
 return f?f.id:null;}
function setRoomHover(id){
 if(roomHover===id)return;
 if(roomHover!=null)map.setFeatureState({source:"rooms",id:roomHover},{hover:false});
 roomHover=(id==null?null:id);
 if(roomHover!=null)map.setFeatureState({source:"rooms",id:roomHover},{hover:true});}

map.on("load",function(){
 /* QUESTION 1 — dark theme. This is the argument for MapLibre over the Leaflet
    map we ship today: that one tones RASTER tiles with a CSS filter, a blunt
    instrument applied to a picture. Here every layer is restyled individually,
    so roads, water, labels and fills each take their own token. */
 var recol=0;
 map.getStyle().layers.forEach(function(l){
  try{
   if(l.type==="background"){map.setPaintProperty(l.id,"background-color",C.base);recol++;}
   else if(l.type==="fill"){
    map.setPaintProperty(l.id,"fill-color",/water|ocean|river/i.test(l.id)?C.water:C.surface);
    map.setPaintProperty(l.id,"fill-opacity",/water|ocean|river/i.test(l.id)?1:0.55);recol++;}
   else if(l.type==="line"){
    map.setPaintProperty(l.id,"line-color",/water|river/i.test(l.id)?C.water:C.line);recol++;}
   else if(l.type==="symbol"){
    map.setPaintProperty(l.id,"text-color",C.dim);
    map.setPaintProperty(l.id,"text-halo-color",C.base);
    map.setPaintProperty(l.id,"text-halo-width",1.2);recol++;}
   else if(l.type==="fill-extrusion"){map.setPaintProperty(l.id,"fill-extrusion-opacity",0);recol++;}
  }catch(e){}
 });
 window._recol=recol;

 map.addSource("ofm",{type:"vector",url:"https://tiles.openfreemap.org/planet"});
 map.addLayer({id:"a2f",source:"ofm","source-layer":"building",type:"fill",minzoom:13,
  paint:{"fill-color":C.raised,"fill-opacity":0.55}});
 /* The city layer. Flat colour, NO feature-state: highlighting every building
    is noise, and leaving that path live alongside the room-scoped one is what
    made the whole map light up. Hover lives on room-fill only. */
 map.addLayer({id:"a2b",source:"ofm","source-layer":"building",type:"fill-extrusion",minzoom:13,
  paint:{"fill-extrusion-color":C.pin,
   "fill-extrusion-height":["coalesce",["get","render_height"],0],
   "fill-extrusion-base":["coalesce",["get","render_min_height"],0],
   "fill-extrusion-opacity":0.92}});

 /* Our own room layer. Hover lights ONLY these 17 — highlighting any building
    is noise. feature ids here are ours (1..17), assigned at build time, so
    nothing depends on what the tiles happen to expose. */
 map.addSource("rooms",{type:"geojson",data:FP});
 map.addLayer({id:"room-fill",source:"rooms",type:"fill-extrusion",
  paint:{"fill-extrusion-color":["case",["boolean",["feature-state","hover"],false],C.value,C.accent300],
   "fill-extrusion-height":["+",["coalesce",["get","height"],["*",["coalesce",["get","levels"],1],3.2]],2],
   "fill-extrusion-base":0,
   "fill-extrusion-opacity":["case",["boolean",["feature-state","hover"],false],0.95,0.55]}});
 map.addLayer({id:"room-line",source:"rooms",type:"line",
  paint:{"line-color":C.accent300,"line-width":1.2,"line-opacity":0.9}});

 map.on("mousemove","room-fill",function(e){
  if(e.features.length)setRoomHover(e.features[0].id);map.getCanvas().style.cursor="pointer";});
 map.on("mouseleave","room-fill",function(){setRoomHover(null);map.getCanvas().style.cursor="";});

 ROOMS.forEach(function(r){var e=document.createElement("div");
  e.style.cssText="width:12px;height:12px;border-radius:50%;background:"+C.accent300+
   ";border:2px solid "+C.base+";cursor:pointer";
  /* Pin hover lights the room's OWN polygon, looked up by slug — not by
     querying whatever the tiles put under the point. */
  e.addEventListener("mouseenter",function(){setRoomHover(idFor(r[0]));});
  e.addEventListener("mouseleave",function(){setRoomHover(null);});
  new maplibregl.Marker({element:e}).setLngLat([r[2],r[1]]).addTo(map);});


 map.once("idle",report);
 map.on("moveend",function(){clearTimeout(window._t);window._t=setTimeout(report,500);});
});

/* setHover() removed: it drove the generic tile-building highlight, which is
   exactly the broad path that had to GO for the room-scoped one to be the only
   behaviour. Leaving it uncalled would have left a live-looking function that
   reintroduces the bug the moment someone wires it back up. */

/* Which building sits under a room's coordinate, and is it the TOWER or the
   PODIUM? A resort centroid sits over the low podium — the same thing that made
   ARIA read 20 m from Overpass. Compare the point hit against the tallest
   feature in a small box around it. */
function buildingAt(lon,lat){
 var pt=map.project([lon,lat]);
 var hit=map.queryRenderedFeatures(pt,{layers:["a2b"]})[0];
 var box=[[pt.x-70,pt.y-70],[pt.x+70,pt.y+70]];
 var near=map.queryRenderedFeatures(box,{layers:["a2b"]});
 var tallest=null;
 near.forEach(function(f){var h=+f.properties.render_height||0;
  if(!tallest||h>(+tallest.properties.render_height||0))tallest=f;});
 if(!hit)return null;
 return {id:hit.id,hit:hit,tallest:tallest,
  h:+hit.properties.render_height||0,
  th:tallest?(+tallest.properties.render_height||0):0,
  name:hit.properties.name||null};
}

function report(){
 var f=map.queryRenderedFeatures({layers:["a2b"]}),s=new Map();
 idsSeen=0;idsMissing=0;
 f.forEach(function(x){
  if(x.id!=null)idsSeen++;else idsMissing++;
  var k=x.id!=null?x.id:JSON.stringify(x.geometry.coordinates[0]&&x.geometry.coordinates[0][0]);
  if(!s.has(k))s.set(k,x);});
 var all=Array.from(s.values());
 var wh=all.filter(function(x){return +x.properties.render_height>0;});
 var tall=wh.filter(function(x){return +x.properties.render_height>=60;})
   .sort(function(a,b){return b.properties.render_height-a.properties.render_height;});
 var b=map.getBounds();
 var iv=ROOMS.filter(function(r){return b.contains([r[2],r[1]]);});
 var p=all.length?Object.keys(all[0].properties):[];
 var hasH=p.indexOf("height")>-1,hasL=p.indexOf("building:levels")>-1||p.indexOf("levels")>-1;

 /* Per-room resolution, only for rooms actually in the viewport — a room off
    screen has no rendered feature to hit, and reporting it as "not found" would
    be the same unknown-vs-absent confusion this project keeps re-deriving. */
 var res=iv.map(function(r){var g=buildingAt(r[2],r[1]);return [r[0],g];});
 var resolved=res.filter(function(x){return x[1];}).length;
 var podium=res.filter(function(x){return x[1]&&x[1].th>x[1].h+8;}).length;

 document.getElementById("inv").innerHTML=
 "<h1>Inventory</h1><p class='sub'>printed before judging the view - z"+map.getZoom().toFixed(2)+
 ", pitch "+(map.getPitch()|0)+"</p>"+

 "<h2>1. Dark theme</h2><p><b class='ok'>"+(window._recol||0)+"</b> style layers restyled "+
 "individually to the locked palette.</p><p class='dim'>Leaflet tones a raster picture with one "+
 "CSS filter. Here water, roads, labels and fills each took their own token — this is the "+
 "capability, not just the colour.</p>"+

 "<h2>2. Tile feature ids — recorded, no longer depended on</h2>"+
 "<p>features with an <code>id</code>: <b class='"+(idsMissing?"flat":"ok")+"'>"+idsSeen+"</b>"+
 " &nbsp; without: <b class='"+(idsMissing?"flat":"dim")+"'>"+idsMissing+"</b></p>"+
 (idsMissing? "<p class='flat'><b>Missing ids means:</b> <code>feature-state</code> cannot address "+
  "those features. The source would need <code>promoteId</code> pointed at a unique property — "+
  "check the property list below for a candidate before promising hover.</p>"
  : "<p class='ok'>Every rendered feature carries an id.</p>")+
 "<p class='dim'>Kept because it is a real finding about the tiles — but hover no longer "+
 "depends on it. We highlight our OWN 17 polygons, so tile ids, per-tile splitting and podium "+
 "ambiguity are all routed around rather than managed.</p>"+

 "<h2>2. Room polygons — how each was matched</h2>"+
 "<p><b class='ok'>"+FP.features.length+"</b> of 17 rooms have their own footprint. "+
 "Hover lights only these.</p><table>"+
 FP.features.map(function(f){var m=f.properties.method;
  var cls=m==="contains+name"?"ok":(m==="name-only"||m==="nearest"?"flat":"dim");
  return "<tr><td>"+f.properties.room+"</td><td class='r "+cls+"'>"+m+"</td></tr>"+
   "<tr><td colspan='2' class='dim'>"+(f.properties.matched||"unnamed polygon")+"</td></tr>";}).join("")+
 "</table><p class='dim'><code>contains+name</code> is strongest: the room's coordinate is inside a "+
 "building named for the property. <code>contains</code> is strong but the polygon is unnamed. "+
 "<span class='flat'><code>name-only</code></span> means the room is NOT inside it — related, not resolved.</p>"+

 "<h2>2b. Tower or podium? (tile features, for comparison)</h2>"+
 "<p>"+resolved+" of "+iv.length+" in-view rooms resolved to a building. "+
 "<b class='"+(podium?"flat":"ok")+"'>"+podium+"</b> hit something shorter than the tallest "+
 "within 70px — i.e. probably the podium.</p><table>"+
 res.map(function(x){
  if(!x[1])return "<tr><td>"+x[0]+"</td><td class='r flat'>no building under point</td></tr>";
  var pod=x[1].th>x[1].h+8;
  return "<tr><td>"+x[0]+"</td><td class='r "+(pod?"flat":"ok")+"'>"+Math.round(x[1].h)+" m"+
   (pod?" <span class='dim'>(tallest near: "+Math.round(x[1].th)+" m)</span>":"")+"</td></tr>"+
   (x[1].name?"<tr><td colspan='2' class='dim'>"+x[1].name+"</td></tr>":"");}).join("")+"</table>"+
 "<p class='dim'>Podium is not necessarily wrong — it is the property's real footprint, and "+
 "visually less damaging than it was numerically. Phil should see which it grabs before the "+
 "behaviour is promised.</p>"+

 "<h2>Can a2 even be implemented?</h2><p>Tile feature properties:<br><code>"+
 (p.join("</code> <code>")||"none")+"</code></p>"+
 "<p>raw <code>height</code>: <b class='"+(hasH?"ok":"flat")+"'>"+(hasH?"YES":"NO")+"</b>"+
 " &nbsp; <code>building:levels</code>: <b class='"+(hasL?"ok":"flat")+"'>"+(hasL?"YES":"NO")+"</b></p>"+
 (hasH?"":"<p class='flat'><b>NO means:</b> OpenMapTiles pre-merges height and building:levels into "+
 "<code>render_height</code>. a2 (height-only) is then NOT IMPLEMENTABLE from these tiles - the "+
 "distinction is gone before we see it. A finding, not a rendering fault.</p>")+

 "<h2>Extruded in view</h2><p><span class='big'>"+wh.length+"</span> <span class='dim'>of "+all.length+
 " features carry height &gt; 0 &nbsp;.&nbsp; "+tall.length+" at 60m+</span></p><table>"+
 tall.slice(0,12).map(function(x){return "<tr><td>"+(x.properties.name||"<span class='dim'>unnamed</span>")+
 "</td><td class='r'>"+Math.round(x.properties.render_height)+" m</td></tr>";}).join("")+"</table>"+
 "<h2>Our rooms in this viewport</h2><p>"+iv.length+" of 17</p><table>"+
 iv.map(function(r){return "<tr><td>"+r[0]+"</td></tr>";}).join("")+"</table>"+
 "<h2 class='flat'>Known absences - expected, not faults</h2>"+
 "<p class='dim'>If the view reads sparse, check here first.</p><table>"+
 KF.map(function(k){return "<tr><td class='flat'>"+k[0]+"</td><td class='r flat'>"+k[1]+
 "</td></tr><tr><td colspan='2' class='dim'>"+k[2]+"</td></tr>";}).join("")+"</table>";
}
